<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Mehdi Azzam portfolio icon</title>
  <desc id="desc">A premium copper and violet MA monogram on a dark rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="8" x2="56" y1="6" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#17141f" />
      <stop offset="0.52" stop-color="#09090f" />
      <stop offset="1" stop-color="#21140c" />
    </linearGradient>
    <linearGradient id="mark" x1="14" x2="50" y1="47" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e55" />
      <stop offset="0.55" stop-color="#f6c177" />
      <stop offset="1" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur" />
      <feColorMatrix in="blur" result="coloredBlur" type="matrix" values="1 0 0 0 0.96 0 1 0 0 0.48 0 0 1 0 0.15 0 0 0 0.7 0" />
